version: 2

sources:
  - name: raw
    description: Données brutes chargées par le pipeline Python (pipeline/ingest/), sans transformation.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: { count: 7, period: day }
    tables:
      - name: projects
        description: Projets du portefeuille HPC (synthétiques, data/raw/portfolio/projects.csv).
      - name: milestones
        description: Jalons des projets (commande, fabrication, livraison, recette…).
      - name: incidents
        description: Incidents ouverts sur les projets.
      - name: costs
        description: Coûts et budgets mensuels par projet.
      - name: top500
        description: >
          Listes TOP500 officielles (top500.org), une ligne par système et par édition.
          Chargées par load_top500.py via top500_parser.py.
        config:
          freshness:
            # publié deux fois par an : on ne prévient qu'après ~7 mois sans nouvelle édition
            warn_after: { count: 210, period: day }
