version: 2

models:
  - name: int_project_milestones
    description: Avancement des jalons par projet (terminés, en retard, prochain jalon).
    columns:
      - name: project_id
        tests: [unique, not_null]
      - name: progress_pct
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100

  - name: int_project_costs
    description: Coûts cumulés et écart au budget par projet (coûts négatifs exclus et comptés).
    columns:
      - name: project_id
        tests: [unique, not_null]
      - name: total_cost_eur
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: int_project_incidents
    description: >
      Incidents enrichis du contexte projet, avec indicateurs de qualité
      (projet connu, dates cohérentes, sévérité valide). Aucune ligne écartée.
    columns:
      - name: incident_id
        tests: [unique, not_null]
