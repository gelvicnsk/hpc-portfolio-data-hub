[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hpc-portfolio-data-hub"
version = "1.0.0"
description = "Mini Enterprise Data Hub : portefeuille HPC + TOP500 (PostgreSQL, dbt, DuckDB, FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
    "duckdb>=1.1",
    "pyarrow>=17",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
# dépendances du conteneur pipeline (dbt) — l'image API n'en a pas besoin
pipeline = [
    "dbt-core>=1.8,<1.13",
    "dbt-postgres>=1.8,<2",
]
dev = [
    "hpc-portfolio-data-hub[pipeline]",
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["pipeline*", "api*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]   # longueur des lignes gérée par ruff format
